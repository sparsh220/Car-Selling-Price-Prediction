
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction Result</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #23395d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .result-card {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 45px 30px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .car-icon {
            font-size: 55px;
            margin-bottom: 18px;
        }

        h1 {
            color: #183153;
            margin-bottom: 12px;
            font-size: 27px;
        }

        .message {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .price-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 25px 15px;
            margin-bottom: 25px;
        }

        .price-label {
            color: #475569;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .price {
            color: #2563eb;
            font-size: 32px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 14px 24px;
            border-radius: 9px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .note {
            margin-top: 22px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="result-card">

        <div class="car-icon">🚘</div>

        <h1>Prediction Complete!</h1>

        <p class="message">
            Based on the details you entered, the estimated
            selling price of your car is:
        </p>

        <div class="price-box">
            <p class="price-label">Estimated Selling Price</p>

            <div class="price">
                ₹ {{ "{:,.0f}".format(prediction) }}
            </div>
        </div>

        <a href="/">← Predict Another Car</a>

        <p class="note">
            This is a machine learning estimate, not a guaranteed market price.
        </p>

    </div>
</body>
</html>
